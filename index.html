<!doctype html>
<html lang="pt-BR" translate="no">
  <head>
    <meta charset="UTF-8" />
    <meta name="google" content="notranslate" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <link rel="icon" type="image/png" sizes="32x32" href="/icon-escura-32.png" media="(prefers-color-scheme: light)" />
    <link rel="icon" type="image/png" sizes="32x32" href="/icon-clara-32.png" media="(prefers-color-scheme: dark)" />
    <link rel="apple-touch-icon" sizes="180x180" href="/icon-escura-180.png" media="(prefers-color-scheme: light)" />
    <link rel="apple-touch-icon" sizes="180x180" href="/icon-clara-180.png" media="(prefers-color-scheme: dark)" />
    <meta property="og:image" content="/logo-escura.png" />
    <meta property="og:image:alt" content="Van's Management 2.0" />
    <!-- Mobile & PWA Configurations -->
    <meta name="theme-color" content="#FF7852" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#000000" media="(prefers-color-scheme: dark)" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="Van's 2.0" />
    
    <!-- Apple Touch Icon (iOS Mobile Home Screen) -->
    <!-- (Defined above for light/dark scheme support) -->
    
    <!-- Android/PWA: escolhe o conjunto de ícones pelo tema do aparelho. -->
    <link id="app-manifest" rel="manifest" href="/manifest-light.json" />
    <link rel="apple-touch-icon" sizes="180x180" href="/icon-escura-180.png" />
    <script>
      (() => {
        const darkScheme = window.matchMedia('(prefers-color-scheme: dark)');
        const syncAppIcons = () => {
          const suffix = darkScheme.matches ? 'dark' : 'light';
          document.getElementById('app-manifest').href = `/manifest-${suffix}.json`;
          const touchIcon = document.querySelector('link[rel="apple-touch-icon"]:not([media])');
          if (touchIcon) touchIcon.href = darkScheme.matches ? '/icon-clara-180.png' : '/icon-escura-180.png';
        };
        syncAppIcons();
        darkScheme.addEventListener?.('change', syncAppIcons);
      })();
    </script>
    
    <title>Van's Management</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
